name: Validate wallpapers

on:
  pull_request:
    paths:
      - 'assets/wallpapers/**'
      - 'data/meta.json'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
